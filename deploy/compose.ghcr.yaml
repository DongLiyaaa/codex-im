name: codex-im-packages

# 使用 GitHub 上预构建的镜像（linux/amd64），部署时不需要构建。内容与 compose.yaml 相同，只是把"本地构建"换成"拉取镜像"，
# 因此新增服务后请用同样方式重新生成，避免两份文件分叉。项目名与源码构建版不同，不会复用它的数据库卷。

# Everything here is self-contained: its own PostgreSQL container, networks and volumes. It never joins an existing
# network, mounts an existing volume or talks to another project's database.
x-attachment-limits: &attachment_limits
  ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-20971520}
  ATTACHMENT_MAX_FILES: ${ATTACHMENT_MAX_FILES:-5}
  ATTACHMENT_DRAFT_HOURS: ${ATTACHMENT_DRAFT_HOURS:-24}
  ATTACHMENT_PARSE_SECONDS: ${ATTACHMENT_PARSE_SECONDS:-45}
  ATTACHMENT_LEASE_SECONDS: ${ATTACHMENT_LEASE_SECONDS:-180}
  ATTACHMENT_MAX_ATTEMPTS: ${ATTACHMENT_MAX_ATTEMPTS:-3}
  ATTACHMENT_IMAGE_PIXELS: ${ATTACHMENT_IMAGE_PIXELS:-25000000}
  ATTACHMENT_ZIP_ENTRIES: ${ATTACHMENT_ZIP_ENTRIES:-2000}
  ATTACHMENT_ZIP_EXPANDED_BYTES: ${ATTACHMENT_ZIP_EXPANDED_BYTES:-67108864}
  ATTACHMENT_CELLS: ${ATTACHMENT_CELLS:-100000}
  ATTACHMENT_PDF_PAGES: ${ATTACHMENT_PDF_PAGES:-200}
  ATTACHMENT_DINGTALK_DOWNLOAD_DOMAINS: ${ATTACHMENT_DINGTALK_DOWNLOAD_DOMAINS:-dingtalk.com,dingtalkapps.com,alicdn.com,aliyuncs.com}
  # 0 keeps parsing fail-closed: only macOS enforces "no network" for the parser, a container does not.
  ATTACHMENT_ALLOW_PROCESS_ONLY: ${ATTACHMENT_ALLOW_PROCESS_ONLY:-0}

services:
  db:
    image: postgres:16.14-bookworm
    platform: linux/amd64
    environment:
      POSTGRES_USER: hub
      POSTGRES_DB: hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - hub_pgdata:/var/lib/postgresql/data
    networks: [hub_data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U hub -d hub']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1
  api:
    image: ${CODEX_IM_API_IMAGE:-ghcr.io/dongliyaaa/codex-im-api:v-0.0.2}
    platform: linux/amd64
    environment:
      <<: *attachment_limits
      DATABASE_URL: postgresql+psycopg://hub:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/hub
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:18200}
      RUNNER_URL: http://runner:8081
      RUNNER_TOKEN: ${RUNNER_TOKEN:?Set RUNNER_TOKEN}
      HUB_AGENTS: ${HUB_AGENTS:-codex}
      DEFAULT_AGENT: ${DEFAULT_AGENT:-codex}
      PLATFORM_BRIDGE_KEY: ${PLATFORM_BRIDGE_KEY:-}
      PLATFORM_AUTH_KEY: ${PLATFORM_AUTH_KEY:-}
      IM_CONFIG_KEY: ${IM_CONFIG_KEY:-}
      PLATFORM_FEISHU_CLIENT_ID: ${PLATFORM_FEISHU_CLIENT_ID:-}
      PLATFORM_FEISHU_CLIENT_SECRET: ${PLATFORM_FEISHU_CLIENT_SECRET:-}
      PLATFORM_DINGTALK_CLIENT_ID: ${PLATFORM_DINGTALK_CLIENT_ID:-}
      PLATFORM_DINGTALK_CLIENT_SECRET: ${PLATFORM_DINGTALK_CLIENT_SECRET:-}
      FEISHU_TRANSPORT: ${FEISHU_TRANSPORT:-webhook}
      DINGTALK_TRANSPORT: ${DINGTALK_TRANSPORT:-webhook}
      DINGTALK_CLIENT_ID: ${DINGTALK_CLIENT_ID:-}
      DINGTALK_CLIENT_SECRET: ${DINGTALK_CLIENT_SECRET:-}
      DINGTALK_ROBOT_CODE: ${DINGTALK_ROBOT_CODE:-}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_VERIFICATION_TOKEN: ${FEISHU_VERIFICATION_TOKEN:-}
      FEISHU_ENCRYPT_KEY: ${FEISHU_ENCRYPT_KEY:-}
      DINGTALK_APP_SECRET: ${DINGTALK_APP_SECRET:-}
      DINGTALK_ROBOT_ACCESS_TOKEN: ${DINGTALK_ROBOT_ACCESS_TOKEN:-}
      DINGTALK_ROBOT_SECRET: ${DINGTALK_ROBOT_SECRET:-}
      DINGTALK_ROBOT_CHAT_ID: ${DINGTALK_ROBOT_CHAT_ID:-}
    ports: ['${HUB_BIND:-127.0.0.1}:${HUB_PORT:-18200}:18200']
    volumes:
      - hub_attachments:/data/attachments
    networks: [hub_data, hub_runner, hub_egress]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # The API creates and migrates the business tables on startup; the worker and IM processes wait for this.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18200/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    read_only: true
    # The official CLIs run with a throwaway HOME under /tmp for every call.
    tmpfs: ['/tmp:size=128m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1
  attachments:
    # Same image as the API; parsing never runs inside the API or the IM processes.
    image: ${CODEX_IM_API_IMAGE:-ghcr.io/dongliyaaa/codex-im-api:v-0.0.2}
    platform: linux/amd64
    command: [python, -m, app.attachment_worker]
    environment:
      <<: *attachment_limits
      DATABASE_URL: postgresql+psycopg://hub:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/hub
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      IM_CONFIG_KEY: ${IM_CONFIG_KEY:-}
    volumes:
      - hub_attachments:/data/attachments
    networks: [hub_data, hub_egress]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
  im-feishu:
    profiles: [im]
    image: ${CODEX_IM_API_IMAGE:-ghcr.io/dongliyaaa/codex-im-api:v-0.0.2}
    platform: linux/amd64
    command: [python, -m, app.im_connections, --provider, feishu]
    environment:
      DATABASE_URL: postgresql+psycopg://hub:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/hub
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      IM_CONFIG_KEY: ${IM_CONFIG_KEY:-}
      FEISHU_TRANSPORT: ${FEISHU_TRANSPORT:-webhook}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
    networks: [hub_data, hub_egress]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    read_only: true
    tmpfs: ['/tmp:size=32m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: on-failure
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 64
  im-dingtalk:
    profiles: [im]
    image: ${CODEX_IM_API_IMAGE:-ghcr.io/dongliyaaa/codex-im-api:v-0.0.2}
    platform: linux/amd64
    command: [python, -m, app.im_connections, --provider, dingtalk]
    environment:
      DATABASE_URL: postgresql+psycopg://hub:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/hub
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      IM_CONFIG_KEY: ${IM_CONFIG_KEY:-}
      DINGTALK_TRANSPORT: ${DINGTALK_TRANSPORT:-webhook}
      DINGTALK_CLIENT_ID: ${DINGTALK_CLIENT_ID:-}
      DINGTALK_CLIENT_SECRET: ${DINGTALK_CLIENT_SECRET:-}
      DINGTALK_ROBOT_CODE: ${DINGTALK_ROBOT_CODE:-}
    networks: [hub_data, hub_egress]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    read_only: true
    tmpfs: ['/tmp:size=32m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: on-failure
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 64
  runner:
    image: ${CODEX_IM_RUNNER_IMAGE:-ghcr.io/dongliyaaa/codex-im-runner:v-0.0.2}
    platform: linux/amd64
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:?Set RUNNER_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CODEX_AUTH_MODE: ${CODEX_AUTH_MODE:-api}
      CODEX_OAUTH_AUTH_FILE: ${CODEX_OAUTH_AUTH_FILE:-}
      # Optional OAuth: mount only its dedicated writable directory (see README).
      CODEX_MODEL: ${CODEX_MODEL:-}
      # Optional OpenAI-compatible endpoint (plain public https only); needs CODEX_AUTH_MODE=api and the key above.
      CODEX_BASE_URL: ${CODEX_BASE_URL:-}
      # Optional model egress proxy, e.g. http://host.docker.internal:7890; the two bridges below always stay direct.
      CODEX_PROXY_URL: ${CODEX_PROXY_URL:-}
      # Agents offered to users. Claude CLI is an additional option beside Codex and stays off until listed here.
      HUB_AGENTS: ${HUB_AGENTS:-codex}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      # Optional Anthropic-compatible gateway (public https only, without a trailing /v1).
      CLAUDE_BASE_URL: ${CLAUDE_BASE_URL:-}
      CLAUDE_PROXY_URL: ${CLAUDE_PROXY_URL:-}
      PLATFORM_BRIDGE_URL: http://api:18200/internal/platform-mcp
      ATTACHMENT_BRIDGE_URL: http://api:18200/internal/attachment-mcp
    networks: [hub_runner, hub_egress]
    read_only: true
    tmpfs: ['/tmp:size=512m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 2
    pids_limit: 192
networks:
  hub_data:
    internal: true
  hub_runner:
    internal: true
  hub_egress: {}
volumes:
  hub_pgdata: {}
  hub_attachments: {}
